# zyxel_nr7302.yml – ønsket konfigurasjon for Zyxel NR7302
#
# Ønsket oppsett og alle innstillingene som er funnet. Verdiene merket [brukes av skript: …]
# leses av de skriptene: 61 og 62 skriver dem til enheten, 70 sjekker enheten mot dem.
# Resten (merket [ikke testet]) er foreløpig bare dokumentasjon.
# Argumenter og miljøvariabler (IFACE, ENHET, ADMIN_ADDR ...) går foran verdiene her.
#
#   null eller utelatt  = ikke endre verdien på enheten / bruk skriptets standard
#   Personlige verdier (passord, APN-brukernavn) legges i zyxel_nr7302.local.yml ved siden
#   av denne filen. Den blir lagt oppå denne og er git-ignorert.
#
# Merket [verifisert] = testet på Telenor-NR7302 med firmware 1.00(ACHA.1)b3_E0.
# Merket [ikke testet] = stien (vist i kommentaren) finnes i enhetens config, men endringen er
# ikke prøvd ut. Ingen skript leser disse ennå.

# ---------------------------------------------------------------------------------------
# PC-siden (Linux)
# ---------------------------------------------------------------------------------------
pc:
  nettverkskort: auto            # kablet kort mot antennen, f.eks. enp0s31f6. auto = første ethernet-kort [brukes av skript]
  admin_adresse: 192.168.2.4/24  # PC-ens adresse mot enhetens LAN; samme nett som enhet_adresse [brukes av skript]
  enhet_adresse: 192.168.2.1     # Telenor-firmware: 192.168.2.1. Telekom etter fabrikkinnstilling: trolig 192.168.1.1 [brukes av skript]
  zycast_adresse: 192.168.1.4/24 # bare ved flashing med zycast; bootloaderen bruker 192.168.1.0/24 [brukes av skript]

# ---------------------------------------------------------------------------------------
# Enheten
# ---------------------------------------------------------------------------------------
system:
  boot_fra_fabrikkoppsett: false # BootFromFactoryDefault. true = alle endringer slettes ved omstart (Telenor) [verifisert] [brukes av skript: 61, 70]

lan:
  dhcp_server: true              # DHCPv4.Server.Enable [verifisert] [brukes av skript: 61, 70]

# Tilgang til enhetens egne tjenester. modus: LAN_ONLY | WAN_ONLY | LAN_WAN
administrasjon:
  https:  { aktiv: true, modus: LAN_ONLY }          # web-grensesnitt [verifisert] [brukes av skript: 61, 70]
  ssh:    { aktiv: true, modus: LAN_ONLY }          # port 22022 [verifisert] [brukes av skript: 61, 70]
  ssh_passordinnlogging: true    # false = bare nøkkel (DisableSshPasswordLogin) [verifisert] [brukes av skript: 61, 70]
  http:   null                   # X_ZYXEL_RemoteManagement.Service HTTP [ikke testet]
  telnet: null                   # X_ZYXEL_RemoteManagement.Service TELNET [ikke testet]
  ftp:    null                   # X_ZYXEL_RemoteManagement.Service FTP [ikke testet]
  ping:   null                   # X_ZYXEL_RemoteManagement.Service PING [ikke testet]
  wan_admin_i_passthrough: false # PT_HTTP/HTTPS/SSH/TELNET/FTP på port 200xx mot WAN [verifisert] [brukes av skript: 62, 70]

kontoer:
  admin:      { aktiv: true }    # [verifisert] [brukes av skript: 61, 70]
  supervisor: { aktiv: true }    # trengs for ROM-D-backup og cross-flash [verifisert] [brukes av skript: 61, 70]

# Passord settes av scripts/60-zyxel-sett-admin-passord.sh.
# Tomt = enhetens serienummer (DeviceInfo.SerialNumber, står også på etiketten).
# Sett eget passord i zyxel_nr7302.local.yml, aldri i denne filen.
passord:
  admin: ""                      # [brukes av skript: 60]

# ---------------------------------------------------------------------------------------
# Mobilnett – uavhengig av operatør
# ---------------------------------------------------------------------------------------
mobil:
  apn: null                      # Operatørens APN, f.eks. ice.net (Ice) eller telia (Telia). Sett i .local.yml
                                 # eller gi som argument til 62. [verifisert: ice.net] [brukes av skript: 62]
  apn_profiler: [0, 1]           # Telenor-oppsettet bruker to profiler; begge får samme APN [verifisert] [brukes av skript: 62]
  apn_autentisering: null        # None | PAP | CHAP. AccessPoint.X_ZYXEL_AuthenticationType [ikke testet]
  apn_brukernavn: null           # AccessPoint.Username [ikke testet]
  apn_passord: null              # AccessPoint.Password [ikke testet] – legg i .local.yml
  ip_passthrough: null           # true = Ethernet-klienten får operatørens IP direkte.
                                 # Cellular.Interface.X_ZYXEL_IP_PassThrough.Enable [ikke testet]
  foretrukket_teknologi: null    # Auto (standard). Cellular.Interface.PreferredAccessTechnology [ikke testet]
  gnss_posisjon: null            # false = slå av GPS-posisjon (personvern). Cellular.X_ZYXEL_GNSS_Location.Enable [ikke testet]
  plmn: null                     # operatør låst manuelt, f.eks. 24214 (Ice). null = automatisk.
                                 # Ingen sti i configen på Telenor-firmware: settes i web-grensesnittet
                                 # (Broadband → Cellular PLMN) eller med AT+COPS [ikke testet]
  data_roaming: null             # false = ingen nasjonal/internasjonal roaming (se docs).
                                 # Cellular.RoamingEnabled (står på true etter oppsettet) [ikke testet]
  tilpassede_innstillinger: null # Telekom-firmware: «Enable Customized Settings» (Individual) [verifisert i web]

# ---------------------------------------------------------------------------------------
# Operatørens fjernstyring
# ---------------------------------------------------------------------------------------
# false = slå av. true/null = ikke endre (operatørens fjernstyring slås ikke på igjen).
fjernstyring:
  tr069_cwmp: false              # false = av, ACS-URL tømmes, periodisk inform av [verifisert] [brukes av skript: 62, 70]
  tr369_usp_mqtt: false          # false = USP-kontroller, MTP og MQTT-klienter av [verifisert] [brukes av skript: 62, 70]
  fjern_operator_ssh_nokkel: true # true = fjern root sin SSH-nøkkel fra operatøren. Legges inn igjen fra
                                 # factory ved oppstart på Telenor-enheter (se README) [verifisert] [brukes av skript: 62]

# ---------------------------------------------------------------------------------------
# Diverse
# ---------------------------------------------------------------------------------------
tid:
  ntp_server: null               # Time.NTPServer1. Telenor bruker ntp.online.no. F.eks. no.pool.ntp.org [ikke testet]

wifi:
  aktiv: null                    # enhetens innebygde 2,4 GHz-oppsettsnett. WiFi.Radio/SSID.Enable [ikke testet]
