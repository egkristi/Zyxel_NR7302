name: Tester

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tester:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: shellcheck
        run: shellcheck --version && shellcheck scripts/*.sh scripts/lib/*.sh
      - name: bash -n
        run: for f in scripts/*.sh scripts/lib/*.sh; do bash -n "$f"; done
      - name: Python-tester
        run: python3 -m unittest discover -s tests -v
