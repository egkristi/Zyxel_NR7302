site_name: Zyxel NR7302 – fri bruk
site_description: Ta kontroll over en operatørlåst Zyxel NR7302 5G-antenne fra Linux – bruk hvilken som helst operatør, lokal administrasjon, ingen fjernstyring.
site_url: https://egkristi.github.io/Zyxel_NR7302/
repo_url: https://github.com/egkristi/Zyxel_NR7302
repo_name: egkristi/Zyxel_NR7302
edit_uri: ""
copyright: MIT-lisens · Bygger på funnene i davidohne/Zyxel_NR7302

docs_dir: docs
exclude_docs: |
  README.md
  README.en.md

# Sidene index, veiledning, skript, konfigurasjon, tekniske-funn og om (norsk og .en.md)
# henter tekst fra README-filene og yml-filen i repoet (se .mkdocs/hooks.py), så innholdet
# bare finnes ett sted.
# Engelske sider er <side>.en.md og publiseres under /en/ (mkdocs-static-i18n).
hooks:
  - .mkdocs/hooks.py

nav:
  - Hjem: index.md
  - Steg for steg: veiledning.md
  - Veiledninger:
      - Telenor → Telekom-firmware: flash-telenor-til-dtag.md
      - Ytelse og operatører: ytelse-og-operatorer.md
  - Referanse:
      - Skript: skript.md
      - Konfigurasjonsfil: konfigurasjon.md
      - Tekniske funn: tekniske-funn.md
  - Om: om.md

theme:
  name: material
  language: nb
  icon:
    logo: material/antenna
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Mørkt tema
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Lyst tema

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search:
      lang: ["no"]
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: nb
          name: Norsk
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: Zyxel NR7302 – operator-independent use
          site_description: Take control of an operator-locked Zyxel NR7302 5G antenna from Linux – any operator, local management, no remote management.
          nav_translations:
            Hjem: Home
            Steg for steg: Step by step
            Veiledninger: Guides
            Telenor → Telekom-firmware: Telenor → Telekom firmware
            Ytelse og operatører: Performance and operators
            Referanse: Reference
            Skript: Scripts
            Konfigurasjonsfil: Configuration file
            Tekniske funn: Technical findings
            Om: About

validation:
  links:
    anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/egkristi/Zyxel_NR7302
